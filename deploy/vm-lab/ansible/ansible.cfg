[defaults]
inventory = ../generated/ansible/inventory.ini
# Explicit so a playbook under playbooks/ (e.g. toggle_victim_syn_protection.yml)
# can include_role: a role under ansible/roles/ too -- site.yml itself already
# resolved roles/ here by Ansible's own default (playbook_dir/roles, and
# site.yml sits in this same directory), this just makes that path explicit
# and independent of which playbook's directory is doing the including.
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
