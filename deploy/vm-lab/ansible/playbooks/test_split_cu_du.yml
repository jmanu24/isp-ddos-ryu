---
# test_split_cu_du.yml -- split CU/DU across two real VMs (`ran` = CU,
# `du` = DU, F1 over the real RAN network, not loopback): full attach and
# real UP data-plane traffic. Confirmed working end-to-end on a real run
# (2026-09-21) -- see docs/ran-testing.md SS8 for the full debugging
# story (an F1-U/N3 GTP-U port collision and a 1-thread real-time worker
# pool from `du`'s original 4-vCPU sizing both had to be found and fixed
# to get here).
#
# This playbook used to also cover E2SM-KPM UE identification and
# correlation against core5g's own AMF/SMF/UPF session records (tags
# kpm/correlate, see docs/ran-testing.md SS9) -- removed after the RIC
# migration, since that KPM-capture step was built directly against the
# previous near-RT RIC's own example xApp binary and does not carry over
# to oran-sc-ric. The underlying srsRAN-side patch that makes
# amf_ue_ngap_id and gnb_cu_ue_f1ap travel together in one KPM record
# (docs/ran-testing.md SS9.1) is unaffected and still applies; only the
# capture/correlate automation here needs re-porting to the current RIC's
# own xApp tooling (oran_bridge/kpm_bridge_xapp.py), not done yet.
#
# Prerequisites: site.yml already run for core5g_open5gs, ric_oran_sc,
# ran_srsran, du_srsran and ue_srsue -- this playbook only launches/tests
# the already-built binaries, it doesn't build anything. `du` must be
# sized at 8 vCPUs (topology.yaml) -- 4 was confirmed insufficient (see
# docs/ran-testing.md SS8.4).
#
# Usage:
#   ansible-playbook playbooks/test_split_cu_du.yml
#   ansible-playbook playbooks/test_split_cu_du.yml --skip-tags victim

- name: Kill any stale CU and launch a fresh one
  hosts: ran_srsran
  gather_facts: false
  tasks:
    - name: Find any running srscu
      ansible.builtin.shell: pgrep -f '^srscu -c' || true
      register: stale_cu
      changed_when: false

    - name: Kill it
      ansible.builtin.shell: "kill -9 {{ stale_cu.stdout_lines | join(' ') }} 2>/dev/null; true"
      when: stale_cu.stdout_lines | length > 0
      changed_when: true

    - name: Launch CU (srscu -- CU-CP + CU-UP combined)
      ansible.builtin.shell: >-
        rm -f /tmp/cu.log /tmp/cu_stdout.log &&
        setsid nohup srscu -c /etc/srsran/cu_split.yaml
        > /tmp/cu_stdout.log 2>&1 < /dev/null &
      changed_when: true

    - name: Wait for the CU's F1-C/E2/N2 sockets to bind
      ansible.builtin.wait_for:
        timeout: 4
      delegate_to: localhost

    - name: Confirm it's still up (didn't crash on startup -- e.g. the
            F1-U/N3 GTP-U port collision this lab hit once, see
            cu_split.yaml.j2's own header)
      ansible.builtin.shell: pgrep -f '^srscu -c'
      register: cu_pid
      changed_when: false
      failed_when: cu_pid.stdout == ""

- name: Kill any stale DU and launch a fresh one
  hosts: du_srsran
  gather_facts: false
  tasks:
    - name: Find any running srsdu
      ansible.builtin.shell: pgrep -f '^srsdu -c' || true
      register: stale_du
      changed_when: false

    - name: Kill it
      ansible.builtin.shell: "kill -9 {{ stale_du.stdout_lines | join(' ') }} 2>/dev/null; true"
      when: stale_du.stdout_lines | length > 0
      changed_when: true

    - name: Launch DU (srsdu -- pairs with the CU over real F1)
      ansible.builtin.shell: >-
        rm -f /tmp/du.log /tmp/du_stdout.log &&
        setsid nohup srsdu -c /etc/srsran/du_split.yaml
        > /tmp/du_stdout.log 2>&1 < /dev/null &
      changed_when: true

    - name: Wait for F1 setup with the CU to complete
      ansible.builtin.wait_for:
        timeout: 8
      delegate_to: localhost

    - name: Confirm it's still up (didn't stall at cell activation -- the
            single-real-time-worker-thread bug this lab hit once at 4
            vCPUs, see docs/ran-testing.md SS8.4)
      ansible.builtin.shell: pgrep -f '^srsdu -c'
      register: du_pid
      changed_when: false
      failed_when: du_pid.stdout == ""

    - name: Confirm the F1 SCTP association to the CU is actually up --
            /proc/net/sctp/assocs uses separate whitespace-delimited
            LPORT/RPORT columns, not addr-colon-port notation (confirmed
            on a real run -- a colon-38472 grep pattern never matches
            this file at all, regardless of timing; don't copy that
            mistake again)
      ansible.builtin.shell: grep -cE '\s38472\s' /proc/net/sctp/assocs || true
      register: f1_assoc
      changed_when: false
      failed_when: f1_assoc.stdout | trim | int == 0

- name: Launch the UE and confirm PDU Session Establishment
  hosts: ue_srsue
  gather_facts: false
  tasks:
    - name: Find any running srsue or background traffic ping
      ansible.builtin.shell: pgrep -f '^srsue ' || true
      register: stale_ue
      changed_when: false

    - name: Kill any stale UE
      ansible.builtin.shell: "kill -9 {{ stale_ue.stdout_lines | join(' ') }} 2>/dev/null; true"
      when: stale_ue.stdout_lines | length > 0
      changed_when: true

    - name: Launch srsue (ue_direct_zmq_split_du.conf -- direct to the
            DU's own RAN-network address, NOT ran's)
      ansible.builtin.shell: >-
        rm -f /tmp/ue_direct.log &&
        ulimit -s 1024 &&
        setsid nohup srsue /etc/srsran/ue_direct_zmq_split_du.conf
        > /tmp/ue_stdout.log 2>&1 < /dev/null &
      changed_when: true

    - name: Poll srsue's own stdout for PDU Session Establishment
      ansible.builtin.shell: grep -c 'PDU Session Establishment successful' /tmp/ue_stdout.log || true
      register: pdu_check
      until: pdu_check.stdout | trim | int > 0
      retries: 12
      delay: 2
      changed_when: false
      failed_when: false

    - name: Report attach result
      ansible.builtin.debug:
        msg: >-
          {{ 'PDU Session established.' if (pdu_check.stdout | trim | int > 0)
             else 'RACH/attach did not complete within ~24s -- this is the
             same non-deterministic RACH flakiness test_single_ue.yml
             already documents. Re-run this playbook.' }}

    - name: Fail loudly if attach didn't complete
      ansible.builtin.fail:
        msg: Attach failed -- see the report above. Re-run the playbook.
      when: pdu_check.stdout | trim | int == 0

    - name: Bring up loopback and add the default route inside the UE's netns
      # tags: [always] -- confirmed necessary on a real run: without it,
      # `--tags victim,kpm,correlate` (re-running just the downstream
      # checks against an already-attached UE, e.g. after this same
      # playbook's own CU/DU/UE plays succeeded on a previous invocation)
      # skips this UNTAGGED task along with the kill/launch ones, leaving
      # the netns with no default route -- every ping below then fails
      # immediately with "Network is unreachable", not a real
      # connectivity problem.
      ansible.builtin.shell: |
        ip netns exec ue1 ip link set lo up
        ue_ip=$(ip netns exec ue1 ip -4 -o addr show tun_srsue | awk '{print $4}' | cut -d/ -f1)
        gw="${ue_ip%.*}.1"
        ip netns exec ue1 ip route replace default via "$gw" dev tun_srsue
        echo "$ue_ip"
      register: ue_ip_result
      changed_when: true
      tags: [always]

    - name: "[victim] Confirm real data-plane connectivity (tag: victim)"
      ansible.builtin.shell: "ip netns exec ue1 ping -c 5 -W 3 {{ victim_addr | default(bng_target_ip) | default('10.10.0.100') }}"
      register: ping_victim
      changed_when: false
      tags: [victim]

    - name: "[victim] Report"
      ansible.builtin.debug:
        var: ping_victim.stdout_lines
      tags: [victim]
