---
# reconnect_mobile_domain.yml -- one-shot, idempotent reconnection of the
# whole mobile (5G O-RAN) domain on the oran-sc-ric stack, in the EXACT
# documented order, powering on + starting + validating ONE node before
# moving to the next:
#
#   5gcore -> ric -> cu1 -> du1 -> ue1 -> du2 -> ue2 -> du3 -> ue3
#          -> cu2 -> du4 -> ue4 -> du5 -> ue5 -> (KPM bridge + RC actuator)
#
# For every node: power on its VM (govc), wait for SSH, start its service,
# validate it, and only THEN continue. A CU is always brought up before its
# DUs (F1 needs a fresh CU) and a DU before its UE (ZMQ RACH). This strict
# one-at-a-time sequencing also removes the concurrent-E2-Setup race, so no
# serial/stagger tricks are needed.
#
#   ansible-playbook playbooks/reconnect_mobile_domain.yml
#
# Vars / flags:
#   -e power_cycle=false   -> skip the initial power-OFF-all; each node is
#                             still ensured powered ON (idempotent) in order.
#   --skip-tags victim     -> skip the per-UE data-plane ping (pe/victim down)
#   --tags <play tag>      -> re-run just part (e.g. --tags xapps)
#
# NOTE: this is deliberately sequential (each VM boots before the next node
# starts), which is slower but is the reliable, validated order. It matches
# deploy .../memory: "encenderlas (con sus servicios) en orden estricto,
# validando cada VM al 100% antes de pasar a la siguiente".

######################################################################
# Play 0 -- power OFF every mobile VM (clears degraded ZMQ/SCTP/F1)
######################################################################
- name: Power off the whole mobile domain first
  hosts: localhost
  gather_facts: false
  become: false
  tags: [power]
  vars:
    power_cycle: true
    mobile_vms: [core5g, ric, ran, du, du2, du3, cu2, du4, du5, ue, ue2]
  tasks:
    - name: Note
      ansible.builtin.debug:
        msg: "{{ 'Powering OFF all mobile VMs, then bringing them up one at a time in order.' if power_cycle else 'power_cycle=false -> not powering off; each node still ensured ON in order.' }}"

    - name: Power off all mobile VMs
      ansible.builtin.shell: |
        set -a; . ~/.govc_env; set +a
        govc vm.power -off=true {{ item }} >/dev/null 2>&1 || true
      loop: "{{ mobile_vms }}"
      changed_when: true
      when: power_cycle

    - name: Settle
      ansible.builtin.wait_for: { timeout: 4 }
      when: power_cycle

######################################################################
# 1 -- 5gcore
######################################################################
- name: "1/14  core5g -- power on + validate Open5GS"
  hosts: core5g_open5gs
  gather_facts: false
  tags: [core]
  tasks:
    - ansible.builtin.include_tasks: tasks/power_on.yml
      vars: { pon_vm: core5g, pon_ip: 10.10.0.5 }

    - name: Wait for the open5gs_5gc container to report healthy
      ansible.builtin.shell: docker ps --filter name=open5gs_5gc --format '{{ "{{" }}.Status{{ "}}" }}'
      register: core_status
      until: "'healthy' in core_status.stdout"
      retries: 30
      delay: 5
      changed_when: false

    - name: Confirm the NFs are running
      ansible.builtin.shell: docker exec open5gs_5gc pgrep -c 'open5gs-' || true
      register: nf_count
      changed_when: false
      failed_when: nf_count.stdout | trim | int < 8

    - ansible.builtin.debug:
        msg: "core5g healthy, {{ nf_count.stdout | trim }} Open5GS NFs up."

######################################################################
# 2 -- oran-sc-ric (compose down && up for a consistent RMR mesh)
######################################################################
- name: "2/14  ric -- power on + oran-sc-ric (compose down && up)"
  hosts: ric_flexric        # inventory group name; host is the RIC (10.10.0.4)
  gather_facts: false
  tags: [ric]
  vars:
    ric_compose_dir: /home/labadmin/oran-sc-ric
  tasks:
    - ansible.builtin.include_tasks: tasks/power_on.yml
      vars: { pon_vm: ric, pon_ip: 10.10.0.4 }

    - name: Stop any FlexRIC daemons that would steal sctp/36421
      ansible.builtin.shell: systemctl stop near-rt-ric kpm-telemetry-api 2>/dev/null; true
      changed_when: false

    - name: Ensure the RC actuator port (8768) is published next to the bridge (8767)
      ansible.builtin.shell: >-
        cd {{ ric_compose_dir }} &&
        grep -q '8768:8768' docker-compose.yml ||
        sed -i '/- "8767:8767"/a\      - "8768:8768"' docker-compose.yml
      changed_when: false

    - name: docker compose down && up (NOT just up -- consistent RMR mesh)
      ansible.builtin.shell: >-
        cd {{ ric_compose_dir }} && docker compose down && docker compose up -d
      changed_when: true

    - name: Wait for the 7 RIC containers
      ansible.builtin.shell: >-
        cd {{ ric_compose_dir }} &&
        docker compose ps --status running --format '{{ "{{" }}.Name{{ "}}" }}' | wc -l
      register: ric_up
      until: ric_up.stdout | trim | int >= 7
      retries: 12
      delay: 5
      changed_when: false

    - name: Confirm RIC_INDICATION route points ONLY at the bridge (4561), sctp/36421 + ports
      ansible.builtin.shell: |
        docker exec ric_e2term grep -E '^rte\|12050\|' /opt/e2/dockerRouter.txt
        ss -lnp 2>/dev/null | grep -q ':36421' && echo sctp-ok
        docker port python_xapp_runner | tr '\n' ' '
      register: ric_chk
      changed_when: false
      failed_when: >-
        '4561' not in ric_chk.stdout or ':4560' in ric_chk.stdout or ':4562' in ric_chk.stdout
        or 'sctp-ok' not in ric_chk.stdout
        or '8767' not in ric_chk.stdout or '8768' not in ric_chk.stdout

    - ansible.builtin.debug:
        msg: "oran-sc-ric up: {{ ric_up.stdout | trim }} containers, route+sctp+ports OK. (bridge/actuator launched at the end, after DUs.)"

######################################################################
