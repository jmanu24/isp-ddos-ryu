  hosts: ran
  gather_facts: false
  tags: [cu, cu1]
  tasks:
    - ansible.builtin.include_tasks: tasks/power_on.yml
      vars: { pon_vm: ran, pon_ip: 10.10.0.6 }
    - ansible.builtin.include_tasks: tasks/bring_up_cu.yml

