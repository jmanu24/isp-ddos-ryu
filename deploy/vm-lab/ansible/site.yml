---
# site.yml -- configures all 17 VMs. Each play targets one Ansible group
# from ../generated/ansible/inventory.ini (one group per topology.yaml
# `role:`), running the one role that installs/configures that role's
# real software stack.
#
# Usage:
#   ansible-playbook site.yml                 # everything
#   ansible-playbook site.yml --limit br,ric  # just these groups/hosts
#   ansible-playbook site.yml --check         # dry run

- name: Orchestrator (ryu-manager + exabgp)
  hosts: orchestrator
  roles: [orchestrator]

- name: BNG (accel-ppp + FreeRADIUS)
  hosts: bng
  roles: [bng]

- name: Suscriptor (per-subscriber DHCP sessions + hping3)
  hosts: suscriptor
  roles: [suscriptor]

- name: BR (flow + softflowd/nfcapd + FRR eBGP)
  hosts: br
  roles: [br]

- name: Peer Router (hping3 + bird2 eBGP)
  hosts: peer_router
  roles: [peer_router]

- name: Near-RT RIC + xApp (FlexRIC br-flexric)
  hosts: ric_flexric
  roles: [ric_flexric]

- name: 5G Core (Open5GS, dockerized via srsRAN_Project/docker)
  hosts: core5g_open5gs
  roles: [core5g_open5gs]

- name: RAN (srsRAN Project gNB, ZMQ RF, plus a co-located UE for same-VM testing)
  hosts: ran_srsran
  roles: [ran_srsran, ue_srsue, ue_oai]

- name: DU (srsRAN Project srsdu, split from ran_srsran's srscu -- real
    F1 over the RAN network, not loopback)
  hosts: du_srsran
  roles: [du_srsran]

- name: UE (5x srsUE namespaces + GNU-Radio broker, plus an OAI nrUE alternative)
  hosts: ue_srsue
  roles: [ue_srsue, ue_oai]

- name: PE (Open vSwitch, OpenFlow-controlled by the orchestrator)
  hosts: pe_ovs
  roles: [pe_ovs]

- name: Enterprise sites (routing/NAT + nftables + hping3)
  hosts: enterprise_site
  roles: [enterprise_site]

- name: Victim server
  hosts: victim
  roles: [victim]
