---
- name: netplan apply
  ansible.builtin.command: netplan apply

- name: restart freeradius
  ansible.builtin.systemd:
    name: freeradius
    state: restarted

- name: restart accel-ppp
  ansible.builtin.systemd:
    name: accel-pppd.service
    daemon_reload: true
    state: restarted

- name: reload ddos-bb-offered
  ansible.builtin.systemd:
    name: ddos-bb-offered.service
    daemon_reload: true
    state: restarted

- name: restart bng-flow-api
  ansible.builtin.systemd:
    name: bng-flow-api.service
    daemon_reload: true
    state: restarted
