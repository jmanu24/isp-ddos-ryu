---
# --- Subscriber flow telemetry: conntrack sidecar ----------------------
# telemetry/broadband_adapter.py reads every subscriber flow (real
# destination, protocol, port and rate) from simulation/bng_flow_api.py,
# which queries the kernel's conntrack table. FreeRADIUS accounting stays in
# place for AAA but is not a telemetry source.

- name: Install conntrack for subscriber flow accounting
  ansible.builtin.apt:
    name: conntrack
    state: present
    update_cache: true

- name: Load the conntrack module at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/nf_conntrack.conf
    content: "nf_conntrack\n"
    mode: "0644"

- name: Load the conntrack module now
  ansible.builtin.command: modprobe nf_conntrack
  changed_when: false

- name: Enable per-flow packet/byte counters in conntrack
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-conntrack-acct.conf
    content: "net.netfilter.nf_conntrack_acct = 1\n"
    mode: "0644"
  register: conntrack_acct_conf

- name: Apply the conntrack accounting setting
  ansible.builtin.command: sysctl -w net.netfilter.nf_conntrack_acct=1
  changed_when: false

- name: Create the sidecar directory
  ansible.builtin.file:
    path: /opt/isp-ddos-ryu
    state: directory
    mode: "0755"

- name: Deploy the subscriber flow telemetry sidecar
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../../../simulation/bng_flow_api.py"
    dest: /opt/isp-ddos-ryu/bng_flow_api.py
    mode: "0755"
  notify: restart bng-flow-api

- name: Install the sidecar systemd unit
  ansible.builtin.template:
    src: bng-flow-api.service.j2
    dest: /etc/systemd/system/bng-flow-api.service
    mode: "0644"
  notify: restart bng-flow-api

- name: Enable and start the sidecar
  ansible.builtin.systemd:
    name: bng-flow-api.service
    daemon_reload: true
    enabled: true
    state: started
