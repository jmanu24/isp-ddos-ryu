---
# pe_ovs role -- Open vSwitch, controlled by the orchestrator's own
# ryu-manager over OpenFlow -- this is the real "Ryu <-> switch" path the
# thesis review's own table names for the enterprise domain.
- name: Install packages
  # tcpdump -- pe IS the bridge under test for the whole ENT_DC redesign;
  # needed to confirm ARP/traffic actually crosses it, not something to
  # keep installing by hand every time this comes up.
  community.general.apk:
    name: [openvswitch, openssh, tcpdump]
    state: present
    update_cache: true

- name: Enable and start ovsdb-server + ovs-vswitchd
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [ovsdb-server, ovs-vswitchd]

- name: Create the bridge (idempotent -- ovs-vsctl no-ops if it exists)
  ansible.builtin.command:
    cmd: ovs-vsctl --may-exist add-br br-ent

- name: Configure the ENT_DC interface (eth2 -- hot-added via govc
        vm.network.add after this VM was already provisioned, so
        render_alpine_answerfile's apply.sh never configured it; bridged,
        no L3 address of its own, exactly like eth1 below)
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    marker: "# {mark} ANSIBLE MANAGED BLOCK -- ent_dc iface"
    block: |
      auto {{ pe_ent_dc_iface }}
      iface {{ pe_ent_dc_iface }} inet manual
  notify: restart networking

- name: Configure the 3 VLAN_BACKBONE interfaces (eth3/eth4/eth5 -- same
        hot-added, no-cloud-init-ever-saw-them situation as eth2 above,
        confirmed by hand via `ip -br link show` after each `govc
        vm.network.add`). One per domain (mobile/core5g, fixed/bng,
        peering/br) -- see topology.yaml's own BACKBONE_MOBILE comment
        for why these are 3 SEPARATE point-to-point links and not one
        shared segment -- each remote VM is alone with pe on its own
        portgroup, so pe's bridge is the only way any of them reaches
        victim, the same property ENT_LAN/ENT_DC already have.
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    marker: "# {mark} ANSIBLE MANAGED BLOCK -- {{ item }} iface"
    block: |
      auto {{ item }}
      iface {{ item }} inet manual
  loop:
    - "{{ pe_backbone_mobile_iface }}"
    - "{{ pe_backbone_fixed_iface }}"
    - "{{ pe_backbone_peering_iface }}"
  notify: restart networking

- name: Flush handlers now -- every new iface must actually be up (ifup'd)
        before the ovs-vsctl add-port tasks below, not just at
        end-of-play as notify handlers normally run
  ansible.builtin.meta: flush_handlers

- name: Attach the enterprise-LAN NIC to the bridge
  ansible.builtin.command:
    cmd: "ovs-vsctl --may-exist add-port br-ent {{ ent_lan_iface | default('eth1') }}"

- name: Attach the enterprise-DC NIC to the SAME bridge (the real 2nd port)
  # eth1 (ENT_LAN, the 5 attacker sites) and eth2 (ENT_DC, victim) both
  # land on br-ent -- this is what makes pe a genuine 2-port bridge
  # instead of a dead-end stub with one real port. Confirmed necessary on
  # a real run: with only eth1 attached, ent-site-N -> victim traffic had
  # a completely separate path around pe entirely (see topology.yaml's
  # ENT_DC comment), so ryu-manager's flow-stats polling of this switch
  # saw nothing during a real, live hping3 flood.
  ansible.builtin.command:
    cmd: "ovs-vsctl --may-exist add-port br-ent {{ ent_dc_iface | default('eth2') }}"

- name: Attach the 3 VLAN_BACKBONE NICs to the SAME bridge -- br-ent goes
        from 2 ports to 5. Ryu's own forwarding (forwarding/learning_switch.py)
        is a generic L2 learning switch with no per-port hardcoding, so
        these 3 more ports need no controller-side code change -- just
        wiring, confirmed by reading that module before this change.
  ansible.builtin.command:
    cmd: "ovs-vsctl --may-exist add-port br-ent {{ item }}"
  loop:
    - "{{ pe_backbone_mobile_iface }}"
    - "{{ pe_backbone_fixed_iface }}"
    - "{{ pe_backbone_peering_iface }}"

- name: Point the bridge at the orchestrator's OpenFlow controller
  ansible.builtin.command:
    cmd: "ovs-vsctl set-controller br-ent tcp:{{ orchestrator_addr | default('10.10.0.1') }}:6653"

- name: Set OpenFlow13 (matches controller/ryu_controller_2.py's own OFP_VERSIONS)
  ansible.builtin.command:
    cmd: ovs-vsctl set bridge br-ent protocols=OpenFlow13
