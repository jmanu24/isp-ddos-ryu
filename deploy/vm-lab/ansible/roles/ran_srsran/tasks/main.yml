---
# ran_srsran role -- OCUDU gNB (srsRAN Project's successor as of this
# lab's build; CU+DU+RU fused, no F1 split), ZMQ RF driver (no SDR
# hardware), built with the E2 interface enabled -- this is what the
# ric_flexric role's FlexRIC actually talks to.
- name: Install build dependencies
  ansible.builtin.apt:
    name:
      - cmake
      - make
      - gcc
      - g++
      - pkg-config
      - libfftw3-dev
      - libmbedtls-dev
      - libsctp-dev
      - libyaml-cpp-dev
      - libgtest-dev
      - libzmq3-dev
      - git
    state: present
    update_cache: true

- name: Clone OCUDU (srsRAN Project's successor, Linux Foundation-governed)
  # OCUDU replaces srsRAN_Project as of this lab's build -- confirmed via
  # gitlab.com/ocudu/ocudu's own README/CMakeLists: same CU/CP/CU-UP/DU/
  # gNB app layout, same ENABLE_EXPORT/ENABLE_ZEROMQ cmake options (both
  # still option()-defined with identical names/semantics), same gnb
  # binary name and YAML config schema (cu_cp/ru_sdr/cell_cfg) -- verified
  # against OCUDU's own official "Using srsUE" tutorial, which pairs it
  # with exactly the srsRAN_4G/srsUE this lab's ue_srsue role already
  # builds (23.11+, matching our pinned release_23_11). No UE component
  # exists in OCUDU itself -- ue_srsue stays on srsRAN_4G unchanged.
  ansible.builtin.git:
    repo: https://gitlab.com/ocudu/ocudu.git
    dest: /opt/ocudu
    version: release_26_04
    force: false

- name: Create build directory
  ansible.builtin.file:
    path: /opt/ocudu/build
    state: directory

- name: Configure (cmake, ZMQ + export/E2 enabled)
  ansible.builtin.command:
    cmd: cmake ../ -DENABLE_EXPORT=ON -DENABLE_ZEROMQ=ON
    chdir: /opt/ocudu/build
    creates: /opt/ocudu/build/CMakeCache.txt

- name: Build (this takes a while -- gNB + all libraries)
  ansible.builtin.command:
    cmd: make -j{{ ansible_processor_vcpus | default(4) }}
    chdir: /opt/ocudu/build

- name: Install
  ansible.builtin.command:
    cmd: make install
    chdir: /opt/ocudu/build
  become: true

- name: Create /etc/srsran
  # ansible.builtin.template doesn't create parent dirs -- confirmed on a
  # real run: "Destination directory /etc/srsran does not exist" (the
  # srsRAN Project build/install step doesn't create it either).
  ansible.builtin.file:
    path: /etc/srsran
    state: directory
    mode: "0755"

- name: Deploy gNB ZMQ config (multi-UE, matches ric_flexric's E2 subscription expectations)
  ansible.builtin.template:
    src: gnb_zmq.yaml.j2
    dest: /etc/srsran/gnb_zmq.yaml
    mode: "0644"

- name: Deploy gNB ZMQ config for pairing with the OAI UE instead (see
        ue_oai role and this template's own header comment for why)
  ansible.builtin.template:
    src: gnb_zmq_oai.yaml.j2
    dest: /etc/srsran/gnb_zmq_oai.yaml
    mode: "0644"
