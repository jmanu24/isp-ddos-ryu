---
# ran_srsran role -- OCUDU gNB (srsRAN Project's successor as of this
# lab's build; CU+DU+RU fused, no F1 split), ZMQ RF driver (no SDR
# hardware), built with the E2 interface enabled -- this is what the
# ric_flexric role's FlexRIC actually talks to.
- name: Install build dependencies
  ansible.builtin.apt:
    name:
      - cmake
      - make
      - gcc
      - g++
      - pkg-config
      - libfftw3-dev
      - libmbedtls-dev
      - libsctp-dev
      - libyaml-cpp-dev
      - libgtest-dev
      - libzmq3-dev
      - git
    state: present
    update_cache: true

- name: Clone OCUDU (srsRAN Project's successor, Linux Foundation-governed)
  # OCUDU replaces srsRAN_Project as of this lab's build -- confirmed via
  # gitlab.com/ocudu/ocudu's own README/CMakeLists: same CU/CP/CU-UP/DU/
  # gNB app layout, same ENABLE_EXPORT/ENABLE_ZEROMQ cmake options (both
  # still option()-defined with identical names/semantics), same gnb
  # binary name and YAML config schema (cu_cp/ru_sdr/cell_cfg) -- verified
  # against OCUDU's own official "Using srsUE" tutorial, which pairs it
  # with exactly the srsRAN_4G/srsUE this lab's ue_srsue role already
  # builds (23.11+, matching our pinned release_23_11). No UE component
  # exists in OCUDU itself -- ue_srsue stays on srsRAN_4G unchanged.
  ansible.builtin.git:
    repo: https://gitlab.com/ocudu/ocudu.git
    dest: /opt/ocudu
    version: release_26_04
    force: false
    # Once cloned, never touch this checkout again -- the ocudu#571
    # workaround tasks below intentionally leave local modifications in
    # it, which this module (with update defaulting to true) refuses to
    # run over ("Local modifications exist ... force=no"), confirmed on
    # a real run.
    update: false

# gitlab.com/ocudu/ocudu#571 -- cell_exec/pcell_executor never dispatch
# deferred work under virtualization (confirmed on ESXi here, VirtualBox
# in the upstream report), silently starving the gNB's own DL ZMQ
# tx_channel of samples to send. The ansible.builtin.patch module is
# itself idempotent (dry-run check first), safe to re-run.
- name: Apply the ocudu#571 executor-stall workaround (MAC + RLC TM patches)
  ansible.builtin.patch:
    src: ocudu-571-executor-stall-workaround.patch
    basedir: /opt/ocudu
    strip: 1

# Confirmed on a real run: MAC+RLC-TM alone gets a real UE through
# RACH/RRC Connected but PDU session establishment never completes,
# exactly as ocudu#571 itself describes. This third patch (RLC AM) is
# needed for a working tun_srsue interface -- accepted risk: the issue
# says it breaks 58 of OCUDU's OWN upstream unit tests
# (rlc_tx_am_test_each_sn_size/*), which don't run in this lab anyway.
- name: Apply the ocudu#571 RLC AM patch (needed for PDU session establishment)
  ansible.builtin.patch:
    src: ocudu-571-rlc-am-workaround.patch
    basedir: /opt/ocudu
    strip: 1

# Confirmed on a real run: even with the 3 patches above, a real UE gets
# all the way through Registration Request/Authentication/Security Mode
# Complete (previously unseen), but the AMF's next DownlinkNASTransport
# (Registration Accept) reaches the gNB's NGAP/CU-CP layer fine and then
# never reaches the UE -- a FOURTH executor-stall site NOT covered by
# ocudu#571 itself, found by pattern-matching the same
# ctrl_exec/pcell_executor.defer()/execute() anti-pattern in the DU's own
# F1AP receive path (f1ap_du_impl::handle_message, the in-process
# CU-to-DU handoff in OCUDU's fused CU+DU+RU binary).
- name: Apply the ocudu#571-pattern F1AP-DU workaround (DL NAS/RRC forwarding)
  ansible.builtin.patch:
    src: ocudu-571-f1ap-du-workaround.patch
    basedir: /opt/ocudu
    strip: 1


# gitlab.com/ocudu/ocudu's own ZMQ radio driver (lib/radio/zmq/) enforces
# strict ZMQ REQ/REP request/reply alternation with NO recovery path --
# confirmed on a real run: once a reply is missed for any reason (a
# transient CPU-scheduling hiccup is enough on a colocated/shared VM),
# both radio_zmq_rx_channel and radio_zmq_tx_channel wedge in
# "Waiting for data"/"Waiting for request" forever, since a REQ/REP
# socket has no API-level way to resend once desynced. This adds the
# standard ZMQ "lazy pirate" recovery (close + reopen + reconnect/rebind
# on a 1s stall) to both channels -- confirmed on a real run to reach a
# full NAS registration + PDU session establishment for the first time
# in this project (previously, any single missed reply wedged the gNB
# permanently). The same underlying gap (and the same fix) also applies
# to ue_srsue's srsRAN_4G driver and ue_oai's OAI driver -- see those
# roles' own patches.
- name: Apply the ZMQ REQ/REP stalled-cycle reconnect fix (radio_zmq_rx_channel
        + radio_zmq_tx_channel)
  ansible.builtin.patch:
    src: ocudu-zmq-reconnect.patch
    basedir: /opt/ocudu
    strip: 1
- name: Create build directory
  ansible.builtin.file:
    path: /opt/ocudu/build
    state: directory

- name: Configure (cmake, ZMQ + export/E2 enabled)
  ansible.builtin.command:
    cmd: cmake ../ -DENABLE_EXPORT=ON -DENABLE_ZEROMQ=ON
    chdir: /opt/ocudu/build
    creates: /opt/ocudu/build/CMakeCache.txt

- name: Build (this takes a while -- gNB + all libraries)
  ansible.builtin.command:
    cmd: make -j{{ ansible_processor_vcpus | default(4) }}
    chdir: /opt/ocudu/build

- name: Install
  ansible.builtin.command:
    cmd: make install
    chdir: /opt/ocudu/build
  become: true

- name: Create /etc/srsran
  # ansible.builtin.template doesn't create parent dirs -- confirmed on a
  # real run: "Destination directory /etc/srsran does not exist" (the
  # srsRAN Project build/install step doesn't create it either).
  ansible.builtin.file:
    path: /etc/srsran
    state: directory
    mode: "0755"

- name: Deploy gNB ZMQ config (multi-UE, matches ric_flexric's E2 subscription expectations)
  ansible.builtin.template:
    src: gnb_zmq.yaml.j2
    dest: /etc/srsran/gnb_zmq.yaml
    mode: "0644"

- name: Deploy gNB ZMQ config for pairing with the OAI UE instead (see
        ue_oai role and this template's own header comment for why)
  ansible.builtin.template:
    src: gnb_zmq_oai.yaml.j2
    dest: /etc/srsran/gnb_zmq_oai.yaml
    mode: "0644"

- name: Deploy gNB ZMQ config for when the UE runs on this same VM too
        (see this template's own header comment for why)
  ansible.builtin.template:
    src: gnb_zmq_colocated.yaml.j2
    dest: /etc/srsran/gnb_zmq_colocated.yaml
    mode: "0644"

- name: Deploy gNB ZMQ config for pairing with the OAI UE when it ALSO runs
        on this same VM (see this template's own header comment for why)
  ansible.builtin.template:
    src: gnb_zmq_oai_colocated.yaml.j2
    dest: /etc/srsran/gnb_zmq_oai_colocated.yaml
    mode: "0644"
