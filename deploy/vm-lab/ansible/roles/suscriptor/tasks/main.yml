---
# suscriptor role -- BNGBlaster, reusing this repo's OWN installer script
# rather than reimplementing its version-pinning/OS-detection logic here.
# Version 0.9.17 specifically -- the confirmed-working release documented
# in the project's own bngblaster_broadband_pipeline_status.md memory,
# not "latest" (later releases are unvalidated against this project's
# scenarios).
- name: Install base packages
  ansible.builtin.apt:
    name: [git, curl, python3]
    state: present
    update_cache: true

- name: Clone Tesis_Controller (for its deploy/install_bngblaster.sh AND
        simulation/bng_agent.py -- the distributed-mode control daemon,
        see BNG_DISTRIBUTED_MODE on this repo's own feature/peering-
        distributed-vm branch)
  ansible.builtin.git:
    repo: "{{ tesis_controller_repo_url }}"
    dest: /opt/Tesis_Controller
    version: "{{ tesis_controller_branch }}"
    force: false

- name: Install BNGBlaster 0.9.17
  ansible.builtin.command:
    cmd: ./deploy/install_bngblaster.sh --version 0.9.17
    chdir: /opt/Tesis_Controller
    creates: /usr/sbin/bngblaster
  become: true

# --- MGMT interface (hot-added via govc vm.network.add after this VM ---
# was already provisioned) -- see topology.yaml's own comment on
# suscriptor's interfaces for why: orchestrator has no route to
# BB_ACCESS at all, so the broadband domain's distributed-mode control
# channel needed a real MGMT-side NIC. Host-level reachability ONLY --
# BNGBlaster gets its own separate, address-less NICs below (confirmed
# on a real run: sharing this one didn't work, see that task's comment).

- name: Configure the MGMT interface
  ansible.builtin.template:
    src: 99-mgmt.yaml.j2
    dest: /etc/netplan/99-mgmt.yaml
    mode: "0600"
  notify: netplan apply

# --- BNGBlaster's own dedicated, address-less interfaces --------------
# Confirmed on a real run: BNGBlaster refuses to do anything useful
# (stuck forever, zero DHCP/session traffic, no error visible without
# explicit -l/-L logging flags) on any interface the kernel ALSO has an
# address on -- its own log says so directly: "Interfaces must not have
# an IP address configured in the host OS!". So it needs interfaces
# fully dedicated to it, distinct from the ones above.

- name: Strip ens160's kernel IP (BNGBlaster's own "access" interface
        now -- it was suscriptor's ORIGINAL, cloud-init-assigned NIC,
        carrying 10.20.0.2 and the default route before this; ansible
        itself now reaches suscriptor via MGMT instead, see topology.
        yaml's interface ordering comment). Replaces the addresses line
        with a plain dhcp4=false instead of deleting it outright, so
        ens160's mapping in the netplan YAML never goes empty/null --
        netplan rejects that.
  ansible.builtin.replace:
    path: /etc/netplan/99-lab.yaml
    regexp: '^(\s*)addresses: \[10\.20\.0\.2/24\]$'
    replace: '\1dhcp4: false'
  notify: netplan apply

- name: Remove ens160's now-stale default route/nameservers (the
        dhcp4=false above has neither, and a leftover route through an
        address-less interface fails netplan validation)
  ansible.builtin.lineinfile:
    path: /etc/netplan/99-lab.yaml
    regexp: "{{ item }}"
    state: absent
  loop:
    - "^\\s*routes: \\[\\{to: default, via: 10\\.20\\.0\\.254\\}\\]"
    - "^\\s*nameservers: \\{addresses: \\[8\\.8\\.8\\.8\\]\\}"
  notify: netplan apply

- name: Configure BNGBlaster's dedicated "network" interface (2nd hot-
        added NIC, no kernel IP -- see topology.yaml's suscriptor
        interfaces comment)
  ansible.builtin.copy:
    content: |
      network:
        version: 2
        ethernets:
          {{ bng_network_iface }}:
            dhcp4: false
            dhcp6: false
    dest: /etc/netplan/97-bng-network.yaml
    mode: "0600"
  notify: netplan apply

- name: Disable IPv6 on BNGBlaster's dedicated interfaces (dhcp6=false
        above only stops DHCPv6 -- Linux ALWAYS auto-assigns a link-
        local IPv6 address to any UP interface regardless, via SLAAC,
        and BNGBlaster's OWN "no address in the host OS" check flags
        THAT too. Confirmed on a real run, same warning class as the
        IPv4 fix above, for the auto-assigned link-local address this
        time. deploy/setup_bng_netns.sh's Mininet-mode setup already
        knew to disable IPv6 entirely for exactly this reason -- this
        replicates it for the 2 dedicated NICs.)
  ansible.posix.sysctl:
    name: "net.ipv6.conf.{{ item }}.disable_ipv6"
    value: "1"
    sysctl_set: true
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-bng-disable-ipv6.conf
  loop:
    - "{{ bng_access_iface }}"
    - "{{ bng_network_iface }}"

- name: Flush handlers now -- every NIC above must be in its final state
        before bng-agent starts
  ansible.builtin.meta: flush_handlers

# --- bng-agent (simulation/bng_agent.py) -- persistent BNGBlaster -----
# control daemon, distributed-mode equivalent of webtool/bng_ops.py's
# own local subprocess.Popen (see that module's and bng_agent.py's own
# docstrings for the full picture).

- name: Create the bng-agent FIFO directory
  ansible.builtin.file:
    path: /run/bng-agent
    state: directory
    mode: "1777"

- name: Deploy bng-agent systemd unit
  ansible.builtin.template:
    src: bng-agent.service.j2
    dest: /etc/systemd/system/bng-agent.service
    mode: "0644"
  notify: restart bng-agent

- name: Enable and start bng-agent
  ansible.builtin.systemd:
    name: bng-agent.service
    daemon_reload: true
    enabled: true
    state: started
