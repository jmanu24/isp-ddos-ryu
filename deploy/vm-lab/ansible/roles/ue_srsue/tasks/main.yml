---
# ue_srsue role -- 5x srsUE instances (srsRAN_4G, since srsRAN_Project has
# no UE app), each in its own network namespace, plus the GNU-Radio
# broker that fans DL out to all 5 and sums UL back to the gNB. See
# ../../../../deploy/vm-lab/README.md's "UE realism" section for the
# caveats srsRAN's own docs give about this pattern (PoC-only, not
# scalable/performant, srsUE's 5G bits are maintenance-only).
- name: Install build dependencies
  ansible.builtin.apt:
    name:
      - cmake
      - make
      - gcc
      - g++
      - libfftw3-dev
      - libmbedtls-dev
      - libboost-program-options-dev
      - libconfig++-dev
      - libsctp-dev
      - libzmq3-dev
      - gnuradio
      - git
      # For running the compiled multi_ue_scenario.grc headlessly (see
      # this role's own "Compile the GNU-Radio broker" task below) --
      # gnuradio-companion's own generated flowgraph is a Qt app
      # (generate_options: qt_gui in the .grc itself), which needs a
      # display even though nothing here ever needs to actually SEE it.
      - xvfb
    state: present
    update_cache: true

- name: Clone srsRAN_4G
  ansible.builtin.git:
    repo: https://github.com/srsran/srsRAN_4G.git
    dest: /opt/srsRAN_4G
    # release_23_11, not 23.11 -- confirmed via the repo's own tag list
    # (gh api repos/srsran/srsRAN_4G/tags): "error: pathspec '23.11' did
    # not match any file(s) known to git" on a real run. Earliest version
    # the docs confirm 5G support on -- bump if a later tag is confirmed
    # working, don't float on `master`.
    version: "release_23_11"
    force: false
    # Once cloned, never touch this checkout again -- our own ZMQ req/rep
    # reconnect fix (rf_zmq_imp_rx.c/rf_zmq_imp_trx.h) intentionally leaves
    # local modifications in it, which this module (update defaults to
    # true) refuses to run over ("Local modifications exist ... force=no"),
    # same reasoning as ocudu's own clone task above.
    update: false


# srsRAN_4G's own ZMQ RF driver (lib/src/phy/rf/rf_zmq_imp_rx.c) has the same
# no-recovery gap as OCUDU's own ZMQ radio driver (see ran_srsran's own
# ocudu-zmq-reconnect.patch task for the full explanation) -- its async RX
# thread's ZMQ_REQ socket retries recv() forever on a connection the peer
# (the gNB) may have already recreated, never resending a fresh request.
# Adds the same "lazy pirate" reconnect-on-stall recovery.
- name: Apply the ZMQ REQ stalled-cycle reconnect fix (rf_zmq_async_rx_thread)
  ansible.builtin.patch:
    src: srsran4g-zmq-reconnect.patch
    basedir: /opt/srsRAN_4G
    strip: 1

# proc_ra_nr.cc's own ra_resource_selection() is an upstream TODO (its own
# comment says so) -- it never implements 3GPP 38.321 5.1.2's preamble
# selection at all, just hardcodes preamble_index=0/prach_occasion=0 for
# EVERY UE, EVERY attempt. Invisible with a single UE, but confirmed on a
# real run to be the actual reason this lab's multi-UE ZMQ broker (which
# combines multiple UEs into one RF channel toward the gNB) never produces
# more than one real connection: all UEs' PRACH transmissions are
# bit-identical, so the gNB's own PRACH detector sees (at most) one,
# regardless of how the broker combines the samples upstream -- confirmed
# via the gNB's own log: exactly one PRACH detection, one UE context, for 3
# simultaneously-attaching UEs. Randomizes preamble_index (seeded per-
# process) instead -- see the patch's own comment for why prach_occasion
# stays fixed and why 64 is hardcoded rather than read from config.
- name: Apply the RACH preamble randomization fix (needed for the multi-UE
        broker to produce more than one real connection)
  ansible.builtin.patch:
    src: srsran4g-random-preamble.patch
    basedir: /opt/srsRAN_4G
    strip: 1

- name: Create build directory
  ansible.builtin.file:
    path: /opt/srsRAN_4G/build
    state: directory

- name: Configure (cmake)
  ansible.builtin.command:
    cmd: cmake ../
    chdir: /opt/srsRAN_4G/build
    creates: /opt/srsRAN_4G/build/CMakeCache.txt

- name: Build
  ansible.builtin.command:
    cmd: make -j{{ ansible_processor_vcpus | default(2) }}
    chdir: /opt/srsRAN_4G/build

- name: Install
  ansible.builtin.command:
    cmd: make install
    chdir: /opt/srsRAN_4G/build
  become: true

- name: Create one network namespace per UE
  ansible.builtin.command:
    cmd: "ip netns add ue{{ item }}"
    creates: "/var/run/netns/ue{{ item }}"
  loop: "{{ range(1, 6) | list }}"

# Confirmed on a real run: a plain reboot (e.g. after a `govc vm.change -c`
# vCPU resize) wipes ue1-ue5 -- `ip netns` state lives under /var/run/netns,
# which is tmpfs, not persisted. The task above only ever runs once, at
# provision time, so nothing recreated them, and every srsue instance
# configured for one of these netns then fails with "Failed to
# setup/configure GW interface" (the netns it's told to use in [gw]
# doesn't exist) until someone notices and reruns `ip netns add` by hand.
# A oneshot systemd service closes that gap for good, no ansible rerun
# needed after any future reboot.
- name: Deploy a systemd oneshot to recreate the UE netns on every boot
  ansible.builtin.copy:
    dest: /etc/systemd/system/srsue-netns.service
    mode: "0644"
    content: |
      [Unit]
      Description=Recreate srsue's per-UE network namespaces (tmpfs, lost on reboot)
      DefaultDependencies=no
      Before=network-pre.target
      Wants=network-pre.target

      [Service]
      Type=oneshot
      RemainAfterExit=true
      ExecStart=/bin/sh -c 'for i in 1 2 3 4 5; do ip netns add ue$i 2>/dev/null || true; done'

      [Install]
      WantedBy=multi-user.target
  register: srsue_netns_unit

- name: Enable and start the netns oneshot (starts it now too, covering VMs
        that were already up when this role first ran)
  ansible.builtin.systemd:
    name: srsue-netns.service
    daemon_reload: "{{ srsue_netns_unit.changed }}"
    enabled: true
    state: started

- name: Create /etc/srsran
  # Same fix as ran_srsran -- confirmed on a real run: neither the build
  # nor install step creates this, and ansible.builtin.template doesn't
  # create parent dirs.
  ansible.builtin.file:
    path: /etc/srsran
    state: directory
    mode: "0755"

- name: Deploy per-UE config (distinct ZMQ ports/IMSI/namespace each)
  ansible.builtin.template:
    src: ue_zmq.conf.j2
    dest: "/etc/srsran/ue{{ item }}_zmq.conf"
    mode: "0644"
  loop: "{{ range(1, 6) | list }}"

- name: Deploy the GNU-Radio broker flow graph (based on srsRAN's own docs
        repo .config/multi_ue/multi_ue_scenario.grc, with the two
        gNB-facing ZMQ addresses templated -- confirmed on a real run --
        the original file's 127.0.0.1 on both those blocks assumes gNB
        and this broker share one PC; here they're on different VMs)
  ansible.builtin.template:
    src: multi_ue_scenario.grc.j2
    dest: /etc/srsran/multi_ue_scenario.grc
    mode: "0644"
  register: multi_ue_grc

- name: Create /opt/multi_ue_scenario (grcc's own -o target directory)
  ansible.builtin.file:
    path: /opt/multi_ue_scenario
    state: directory

- name: Check whether the broker was already compiled
  ansible.builtin.stat:
    path: /opt/multi_ue_scenario/multi_ue_scenario.py
  register: multi_ue_py

- name: Compile the GNU-Radio broker flow graph to a standalone script
  # Confirmed on a real run: `grcc` (GNU Radio Companion Compiler, ships
  # with the gnuradio package) turns the .grc into a plain Python script
  # using the gnuradio runtime -- no gnuradio-companion GUI needed to
  # RUN it, only to edit it. This replaces the previously-documented
  # "open in gnuradio-companion and click Execute" manual step with
  # `xvfb-run -a python3 /opt/multi_ue_scenario/multi_ue_scenario.py`
  # (started LAST, after the gNB and all srsue instances -- see this
  # role's own "manual steps" debug task above for why).
  #
  # `or not multi_ue_py.stat.exists` -- confirmed necessary on a real
  # run: gating solely on `multi_ue_grc.changed` skips this forever on
  # any run where the .grc template's rendered content happens to be
  # byte-identical to what's already deployed, EVEN on a host that has
  # never actually run grcc yet (e.g. /opt/multi_ue_scenario/ existing
  # but empty) -- ansible.builtin.template correctly reports "ok", not
  # "changed", in that case, so `multi_ue_grc.changed` alone under-fires.
  ansible.builtin.command:
    cmd: grcc /etc/srsran/multi_ue_scenario.grc -o /opt/multi_ue_scenario
  when: multi_ue_grc.changed or not multi_ue_py.stat.exists
  changed_when: true
  # grcc itself has no reliable idempotent "nothing to do" signal --
  # `when` above already limits this to template-content changes.
  changed_when: true

- name: Deploy a direct-to-gNB single UE config (no broker, diagnostic --
        see the file's own header comment for why)
  ansible.builtin.template:
    src: ue_direct_zmq.conf.j2
    dest: /etc/srsran/ue_direct_zmq.conf
    mode: "0644"

- name: Deploy a direct-to-gNB single UE config for when the gNB runs on
        this same VM too (see the file's own header comment for why)
  ansible.builtin.template:
    src: ue_direct_zmq_colocated.conf.j2
    dest: /etc/srsran/ue_direct_zmq_colocated.conf
    mode: "0644"

- name: Note about the 4th/5th UE and the broker's confirmed UE-isolation gap
  ansible.builtin.debug:
    msg: >-
      ONE manual step this role still can't automate: the deployed .grc
      only wires up 3 UEs (srsRAN's own documented limit for this
      example) -- to actually use UE4/UE5, open
      /etc/srsran/multi_ue_scenario.grc in `gnuradio-companion`, duplicate
      UE3's signal-path blocks twice more, and rewire them to ports
      2401/2400 and 2501/2500 (matching ue4/ue5_zmq.conf's own ports) --
      this needs interactive GUI editing, not something worth
      hand-patching blind in raw XML. Starting/run order (5G Core -> gNB
      -> ALL srsue instances -> the broker LAST) and actually running the
      broker headlessly ARE automated now -- see
      ../../playbooks/test_three_ue_broker.yml. That playbook's own
      header has the full timeline: an initial run found every UE
      colliding on the identical preamble (srsRAN_4G's own
      ra_resource_selection() was an unimplemented upstream TODO, fixed
      by srsran4g-random-preamble.patch below) plus `ue`'s original 2
      vCPUs being badly oversubscribed once 3 srsue + the broker ran
      concurrently (fixed by bumping to 8, see topology.yaml). With both
      fixed, confirmed on a real run that the broker CAN give 3 UEs real,
      distinguishable RF -- but not reliably: still non-deterministic
      (worse than the well-documented single-UE RACH flakiness), and a
      NEW failure mode once preamble detection itself started working
      (Msg3 arriving with crc=KO for the non-first UE, likely the
      broker's own sample-level combining not modeling per-UE timing/CFO
      offsets real OFDM needs). Treat 3-real-UEs as "possible, not
      reliable" -- see docs/ran-testing.md §6.

- name: Note about the direct-config UE's default route (manual step, runtime
        only -- cannot be provisioned in advance)
  ansible.builtin.debug:
    msg: >-
      A THIRD manual step, for ue_direct_zmq.conf specifically: confirmed
      on a real run -- after a successful PDU Session Establishment,
      pinging out through tun_srsue still fails with "Network is
      unreachable". srsue's [gw] section creates the netns and the
      tun_srsue interface with its assigned address, but never adds a
      default route inside that netns -- and this can't be baked in
      ahead of time by this role, since the netns/interface don't exist
      until srsue is actually running. Once srsue reaches "PDU Session
      Establishment successful", run:
      ip netns exec ue1 ip link set lo up &&
      ip netns exec ue1 ip route add default via <UPF's ogstun address
      for this UE's subnet, e.g. 10.45.1.1> dev tun_srsue
      -- see core5g_open5gs's own tasks/main.yml for the matching
      core5g-side NAT/forwarding rules this also depends on.
