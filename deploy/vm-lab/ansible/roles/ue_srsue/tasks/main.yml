---
# ue_srsue role -- 5x srsUE instances (srsRAN_4G, since srsRAN_Project has
# no UE app), each in its own network namespace, plus the GNU-Radio
# broker that fans DL out to all 5 and sums UL back to the gNB. See
# ../../../../deploy/vm-lab/README.md's "UE realism" section for the
# caveats srsRAN's own docs give about this pattern (PoC-only, not
# scalable/performant, srsUE's 5G bits are maintenance-only).
- name: Install build dependencies
  ansible.builtin.apt:
    name:
      - cmake
      - make
      - gcc
      - g++
      - libfftw3-dev
      - libmbedtls-dev
      - libboost-program-options-dev
      - libconfig++-dev
      - libsctp-dev
      - libzmq3-dev
      - gnuradio
      - git
    state: present
    update_cache: true

- name: Clone srsRAN_4G
  ansible.builtin.git:
    repo: https://github.com/srsran/srsRAN_4G.git
    dest: /opt/srsRAN_4G
    # release_23_11, not 23.11 -- confirmed via the repo's own tag list
    # (gh api repos/srsran/srsRAN_4G/tags): "error: pathspec '23.11' did
    # not match any file(s) known to git" on a real run. Earliest version
    # the docs confirm 5G support on -- bump if a later tag is confirmed
    # working, don't float on `master`.
    version: "release_23_11"
    force: false
    # Once cloned, never touch this checkout again -- our own ZMQ req/rep
    # reconnect fix (rf_zmq_imp_rx.c/rf_zmq_imp_trx.h) intentionally leaves
    # local modifications in it, which this module (update defaults to
    # true) refuses to run over ("Local modifications exist ... force=no"),
    # same reasoning as ocudu's own clone task above.
    update: false


# srsRAN_4G's own ZMQ RF driver (lib/src/phy/rf/rf_zmq_imp_rx.c) has the same
# no-recovery gap as OCUDU's own ZMQ radio driver (see ran_srsran's own
# ocudu-zmq-reconnect.patch task for the full explanation) -- its async RX
# thread's ZMQ_REQ socket retries recv() forever on a connection the peer
# (the gNB) may have already recreated, never resending a fresh request.
# Adds the same "lazy pirate" reconnect-on-stall recovery.
- name: Apply the ZMQ REQ stalled-cycle reconnect fix (rf_zmq_async_rx_thread)
  ansible.builtin.patch:
    src: srsran4g-zmq-reconnect.patch
    basedir: /opt/srsRAN_4G
    strip: 1
- name: Create build directory
  ansible.builtin.file:
    path: /opt/srsRAN_4G/build
    state: directory

- name: Configure (cmake)
  ansible.builtin.command:
    cmd: cmake ../
    chdir: /opt/srsRAN_4G/build
    creates: /opt/srsRAN_4G/build/CMakeCache.txt

- name: Build
  ansible.builtin.command:
    cmd: make -j{{ ansible_processor_vcpus | default(2) }}
    chdir: /opt/srsRAN_4G/build

- name: Install
  ansible.builtin.command:
    cmd: make install
    chdir: /opt/srsRAN_4G/build
  become: true

- name: Create one network namespace per UE
  ansible.builtin.command:
    cmd: "ip netns add ue{{ item }}"
    creates: "/var/run/netns/ue{{ item }}"
  loop: "{{ range(1, 6) | list }}"

- name: Create /etc/srsran
  # Same fix as ran_srsran -- confirmed on a real run: neither the build
  # nor install step creates this, and ansible.builtin.template doesn't
  # create parent dirs.
  ansible.builtin.file:
    path: /etc/srsran
    state: directory
    mode: "0755"

- name: Deploy per-UE config (distinct ZMQ ports/IMSI/namespace each)
  ansible.builtin.template:
    src: ue_zmq.conf.j2
    dest: "/etc/srsran/ue{{ item }}_zmq.conf"
    mode: "0644"
  loop: "{{ range(1, 6) | list }}"

- name: Deploy the GNU-Radio broker flow graph (based on srsRAN's own docs
        repo .config/multi_ue/multi_ue_scenario.grc, with the two
        gNB-facing ZMQ addresses templated -- confirmed on a real run --
        the original file's 127.0.0.1 on both those blocks assumes gNB
        and this broker share one PC; here they're on different VMs)
  ansible.builtin.template:
    src: multi_ue_scenario.grc.j2
    dest: /etc/srsran/multi_ue_scenario.grc
    mode: "0644"

- name: Deploy a direct-to-gNB single UE config (no broker, diagnostic --
        see the file's own header comment for why)
  ansible.builtin.template:
    src: ue_direct_zmq.conf.j2
    dest: /etc/srsran/ue_direct_zmq.conf
    mode: "0644"

- name: Deploy a direct-to-gNB single UE config for when the gNB runs on
        this same VM too (see the file's own header comment for why)
  ansible.builtin.template:
    src: ue_direct_zmq_colocated.conf.j2
    dest: /etc/srsran/ue_direct_zmq_colocated.conf
    mode: "0644"

- name: Note about the 4th/5th UE and run order (manual steps)
  ansible.builtin.debug:
    msg: >-
      TWO manual steps this role cannot automate: (1) the deployed .grc
      only wires up 3 UEs (srsRAN's own documented limit for this
      example) -- to actually use UE4/UE5, open
      /etc/srsran/multi_ue_scenario.grc in `gnuradio-companion`, duplicate
      UE3's signal-path blocks twice more, and rewire them to ports
      2401/2400 and 2501/2500 (matching ue4/ue5_zmq.conf's own ports) --
      this needs interactive GUI editing, not something worth
      hand-patching blind in raw XML. (2) Per srsRAN's own application
      note, the ONLY correct start order is: 5G Core -> gNB -> ALL 5
      srsue instances -> the GNU-Radio broker LAST (then click Execute
      inside gnuradio-companion). Starting the broker early is a common
      failure mode.
