---
- name: restart frr
  ansible.builtin.service:
    name: frr
    state: restarted

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: netplan apply
  ansible.builtin.command: netplan apply

- name: restart flow
  ansible.builtin.service:
    name: flow
    state: restarted
