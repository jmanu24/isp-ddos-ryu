<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bloques activos — ISP DDoS</title>
<style>
body { font-family: Arial; margin: 20px; }
nav a { margin-right: 16px; text-decoration: none; color: #336; }
nav a:hover { text-decoration: underline; }
table { border-collapse: collapse; width: 100%; margin-top: 16px; }
th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
th { background: #eef; }
.badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.85em;
    font-weight: bold;
    color: #fff;
}
.badge-enterprise { background: #c44; }
.badge-mobile     { background: #44c; }
.badge-broadband  { background: #484; }
.badge-bgp        { background: #888; }
.btn-unblock {
    background: #c44;
    color: #fff;
    border: none;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
}
.btn-unblock:hover { background: #a22; }
.empty { color: #888; margin-top: 16px; }
#status { margin-top: 12px; color: #282; min-height: 20px; }
</style>
</head>
<body>

<h1>ISP DDoS Dashboard</h1>

<nav>
    <a href="/">Inicio</a>
    <a href="/blocks">Bloques activos</a>
</nav>

<h2>Nodos bloqueados</h2>

<div id="status"></div>
<div id="content"><p class="empty">Cargando…</p></div>

<script>
const BADGE_CLASSES = {
    enterprise: "badge-enterprise",
    mobile:     "badge-mobile",
    broadband:  "badge-broadband",
    bgp:        "badge-bgp",
};

function elapsed(ts) {
    if (!ts) return "—";
    const secs = Math.floor((Date.now() / 1000) - ts);
    if (secs < 60) return secs + "s";
    const mins = Math.floor(secs / 60);
    if (mins < 60) return mins + "m " + (secs % 60) + "s";
    return Math.floor(mins / 60) + "h " + (mins % 60) + "m";
}

function render(blocks) {
    const el = document.getElementById("content");
    if (!blocks || blocks.length === 0) {
        el.innerHTML = '<p class="empty">No hay bloques activos.</p>';
        return;
    }
    const rows = blocks.map(b => {
        const cls = BADGE_CLASSES[b.domain] || "badge-bgp";
        return `<tr>
            <td>${b.src_ip}</td>
            <td>${b.dst_ip}</td>
            <td>${b.dst_port || "—"}</td>
            <td>${b.protocol}</td>
            <td><span class="badge ${cls}">${b.attack_type}</span></td>
            <td><span class="badge ${cls}">${b.domain}</span></td>
            <td>${elapsed(b.blocked_at)}</td>
            <td>
                <button class="btn-unblock"
                    onclick="unblock(${JSON.stringify(b.src_ip)},
                                    ${JSON.stringify(b.dst_ip)},
                                    ${b.dst_port || 0},
                                    ${JSON.stringify(b.protocol)})">
                    Desbloquear
                </button>
            </td>
        </tr>`;
    }).join("");
    el.innerHTML = `<table>
        <thead><tr>
            <th>Fuente</th>
            <th>Destino</th>
            <th>Puerto dst</th>
            <th>Protocolo</th>
            <th>Tipo</th>
            <th>Dominio</th>
            <th>Bloqueado hace</th>
            <th>Acción</th>
        </tr></thead>
        <tbody>${rows}</tbody>
    </table>`;
}

function setStatus(msg, ok) {
    const el = document.getElementById("status");
    el.style.color = ok ? "#282" : "#c44";
    el.textContent = msg;
    setTimeout(() => { el.textContent = ""; }, 4000);
}

function refresh() {
    fetch("/api/blocks")
        .then(r => r.json())
        .then(render)
        .catch(() => {});
}

function unblock(src_ip, dst_ip, dst_port, protocol) {
    fetch("/api/blocks/unblock", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ src_ip, dst_ip, dst_port, protocol }),
    })
    .then(r => r.json())
    .then(data => {
        if (data.ok) {
            setStatus("Bloqueo eliminado correctamente.", true);
            refresh();
        } else {
            setStatus("Error: " + (data.error || "desconocido"), false);
        }
    })
    .catch(() => setStatus("Error de red.", false));
}

refresh();
setInterval(refresh, 5000);
</script>

</body>
</html>
